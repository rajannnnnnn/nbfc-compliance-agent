[project]
name = "clausecheck"
version = "0.1.0"
description = "RBI-grounded lending compliance auditor for Indian NBFCs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "litellm>=1.44",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "tenacity>=8.3",
    "uuid6>=2024.1.12",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.104",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires real Postgres/Redis"]
testpaths = ["tests"]

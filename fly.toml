# fly.toml app configuration file generated for nbfc-compliance-agent on 2026-11-26T03:47:25Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nbfc-compliance-agent'
primary_region = 'sin'

[build]
[env]
  CC_ENV = 'prod'
  CC_REDIS_URL = 'redis://localhost:6379/0'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'

app = "clausecheck-demo"
primary_region = "sin"

[build]

[env]
CC_ENV = "production"
CC_REDIS_URL = "redis://localhost:6379/0"

[processes]
api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
worker = "celery -A app.tasks.celery_app worker -Q extract,assess,maintenance -c 2 --loglevel=info"
redis = "redis-server --bind 127.0.0.1 --port 6379 --save '' --appendonly no"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["api"]

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
processes = ["api", "worker", "redis"]

[checks]
[checks.health]
type = "http"
path = "/healthz"
interval = "15s"
timeout = "5s"
grace_period = "10s"
processes = ["api"]

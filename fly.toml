app = "clausecheck-demo"
primary_region = "sin"

[build]

[env]
CC_ENV = "prod"
CC_REDIS_URL = "redis://localhost:6379/0"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"

[checks]
[checks.health]
type = "http"
path = "/healthz"
interval = "15s"
timeout = "5s"
grace_period = "10s"

app = "clausecheck-demo"
primary_region = "sin"

[build]

[env]
CC_ENV = "prod"
CC_REDIS_URL = "redis://localhost:6379/0"
# Only a Gemini key is provisioned for this deploy — override every model default away
# from the OpenAI names app/config.py ships with, or litellm calls OpenAI with a Gemini
# key and fails (confirmed: "AuthenticationError ... Incorrect API key provided" from
# OpenAI's embeddings endpoint during corpus ingest).
CC_EMBEDDING_MODEL = "gemini/gemini-embedding-001"
CC_EXTRACT_MODEL = "gemini/gemini-2.0-flash"
CC_VERDICT_MODEL = "gemini/gemini-2.0-flash"
CC_CLASSIFY_MODEL = "gemini/gemini-2.0-flash"

[deploy]
release_command = "alembic upgrade head"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
size = "shared-cpu-1x"
memory = "1024mb"

[checks]
[checks.health]
type = "http"
path = "/healthz"
interval = "15s"
timeout = "5s"
grace_period = "10s"

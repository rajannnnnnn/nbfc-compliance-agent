# field_key -> clause_path[]. LLD §7. M5-T05 tightened pins to leaf granularity wherever the
# ingested corpus actually parses a sub-paragraph leaf under the field's topic (DL2025/p9's
# i/ii/iii, DL2025/p10's note/1) — checked directly against the real ingested clause table,
# not assumed from the LLD text. Where a paragraph has no further sub-paragraph structure
# (e.g. RBC2025/p35, RBC-AMD2026/p100W), the bare paragraph path already *is* the leaf, so it
# stays as-is; there is nothing left to tighten there without inventing structure the corpus
# doesn't have (CLAUDE.md §2.6). Against the placeholder corpus in data/raw/instruments/ — see
# docs/DECISIONS.md ADR-001, ADR-015, and the M5-T05 ADR added alongside this change.

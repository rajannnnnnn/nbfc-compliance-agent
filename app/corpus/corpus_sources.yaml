    verification_note: "CORRECTED (2026-09-21): the PDF actually matching this instrument is the one named 329f97d5-362MD26CA... (sha256 baed420340e983d696cc1b6546bdd4513bd4e658977715c5f00a096714a3a559 of the ORIGINAL PDF) -- an earlier note here wrongly attributed a different PDF (837daa67..., which is actually the NBFC Miscellaneous Directions, circular 373, not this one) based on upload-order guessing rather than reading the PDF's own title page. The real circular number printed on page 1 of the correct PDF, 'RBI/DOR/2025-26/362 / DOR.MCS.REC.No.281/01-01-039/2025-26', matches exactly what was already recorded here as a placeholder guess -- strong independent confirmation. Real RBI-hosted source: https://rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12931 (not id=12942 as previously and wrongly noted) -- unreachable from this environment (rbi.org.in 403s at the proxy, SQ-01), so source_url stays local. data/raw/instruments/rbc2025.txt now holds the REAL extracted PDF text (66881 chars, 37 pages, pypdf extraction) in place of the fabricated placeholder -- paragraphs 35 (release timeline), 39 (compensation), 40 (lost documents) match the real text exactly, confirming R01/R02/R02b's citations. paragraph 45 does NOT match R17's premise (microfinance contact hours) -- real para 45 concerns gold/silver collateral valuation methodology disclosure; the real general contact-hour restriction is paragraph 100, which explicitly EXCLUDES microfinance loans and defers to a separate, not-yet-ingested instrument (NBFC Credit Facilities Directions, 2025) -- see ADR-055. citable stays true only for R01/R02/R02b's paragraphs; R17's citation is flagged, not fixed, pending a decision -- do not treat verification_status=unverified as blanket-safe for every paragraph this instrument's rules cite."
